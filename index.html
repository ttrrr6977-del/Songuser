<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluidStream | Listener</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Supabase Client Dependency Library -->
    <script src="https://islyccbrpxorgwnpmnkp.supabase.co"></script>
    <style>
        .liquid-bg { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%); }
        .liquid-glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.07); }
        .liquid-glow { box-shadow: 0 0 30px rgba(139, 92, 246, 0.3); }
    </style>
</head>
<body class="liquid-bg min-h-screen text-slate-100 font-sans flex flex-col justify-between">

    <!-- Auth Container -->
    <div id="auth-screen" class="flex-grow flex items-center justify-center p-6">
        <div class="liquid-glass p-8 rounded-3xl max-w-md w-full liquid-glow">
            <div class="text-center mb-8">
                <div class="inline-flex p-3 rounded-full bg-violet-600/20 text-violet-400 text-3xl mb-3">
                    <i class="fa-solid fa-droplet"></i>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-violet-400 to-fuchsia-400 bg-clip-text text-transparent">FluidStream</h1>
                <p class="text-slate-400 mt-2 text-sm">Sign in or create a listener account</p>
            </div>

            <div class="flex bg-slate-900/50 p-1.5 rounded-2xl mb-6">
                <button id="tab-login" onclick="toggleAuthTab('login')" class="flex-1 py-2 text-sm font-semibold rounded-xl bg-violet-600 text-white transition-all">Log In</button>
                <button id="tab-register" onclick="toggleAuthTab('register')" class="flex-1 py-2 text-sm font-semibold rounded-xl text-slate-400 transition-all">Register</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="text-xs text-slate-400 uppercase tracking-wider block mb-2 font-medium">Username</label>
                    <input type="text" id="login-username" required class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 focus:outline-none focus:border-violet-500 text-white transition-all">
                </div>
                <div>
                    <label class="text-xs text-slate-400 uppercase tracking-wider block mb-2 font-medium">Password</label>
                    <input type="password" id="login-password" required class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 focus:outline-none focus:border-violet-500 text-white transition-all">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-500 hover:to-fuchsia-500 py-3 rounded-xl font-bold tracking-wide transition-all liquid-glow mt-4">Enter Player</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="text-xs text-slate-400 uppercase tracking-wider block mb-2 font-medium">Username</label>
                    <input type="text" id="reg-username" required class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 focus:outline-none focus:border-violet-500 text-white transition-all">
                </div>
                <div>
                    <label class="text-xs text-slate-400 uppercase tracking-wider block mb-2 font-medium">Email Address</label>
                    <input type="email" id="reg-email" required class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 focus:outline-none focus:border-violet-500 text-white transition-all">
                </div>
                <div>
                    <label class="text-xs text-slate-400 uppercase tracking-wider block mb-2 font-medium">Password</label>
                    <input type="password" id="reg-password" required class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 focus:outline-none focus:border-violet-500 text-white transition-all">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-500 hover:to-fuchsia-500 py-3 rounded-xl font-bold tracking-wide transition-all liquid-glow mt-4">Create Account</button>
            </form>
        </div>
    </div>

    <!-- Main Music Player Dashboard -->
    <div id="player-screen" class="hidden flex-grow flex flex-col lg:flex-row h-screen overflow-hidden relative">
        <aside class="w-full lg:w-64 liquid-glass flex flex-col justify-between p-6 border-r border-slate-800">
            <div>
                <div class="flex items-center gap-3 mb-10">
                    <span class="text-violet-500 text-2xl"><i class="fa-solid fa-droplet"></i></span>
                    <span class="text-xl font-bold tracking-tight">FluidStream</span>
                </div>
                <nav class="space-y-3">
                    <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-xl bg-violet-600/15 text-violet-300 font-semibold transition-all">
                        <i class="fa-solid fa-music"></i> Discover
                    </a>
                </nav>
            </div>
            <div class="mt-auto pt-6 border-t border-slate-800/60 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-400">Logged in as</p>
                    <p id="user-display-name" class="font-bold text-sm text-white">Guest</p>
                </div>
                <button onclick="logout()" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-red-950/40 hover:text-red-400 transition-all">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                </button>
            </div>
        </aside>

        <main class="flex-grow flex flex-col p-6 overflow-y-auto pb-32">
            <header class="flex items-center justify-between mb-8">
                <div>
                    <h2 class="text-3xl font-extrabold text-white">Flow State</h2>
                    <p class="text-slate-400">Stream tracks uploaded by community artists.</p>
                </div>
            </header>

            <div id="track-grid" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-6"></div>
        </main>

        <!-- Fluid Playback Bar -->
        <footer class="fixed bottom-0 left-0 right-0 liquid-glass border-t border-slate-800 p-4 flex flex-col md:flex-row items-center justify-between gap-4 z-50">
            <div class="flex items-center gap-4 w-full md:w-1/3">
                <img id="current-cover" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=300" class="w-14 h-14 object-cover rounded-xl border border-slate-800" alt="">
                <div>
                    <h4 id="current-title" class="font-bold text-sm text-white truncate max-w-[200px]">No Song Loaded</h4>
                    <p id="current-artist" class="text-xs text-slate-400 truncate max-w-[200px]">Select a track</p>
                </div>
            </div>

            <div class="flex flex-col items-center gap-2 w-full md:w-1/3">
                <div class="flex items-center gap-6">
                    <button onclick="prevTrack()" class="text-slate-400 hover:text-white transition-all text-lg"><i class="fa-solid fa-backward-step"></i></button>
                    <button onclick="togglePlay()" id="play-btn" class="w-12 h-12 rounded-full bg-white text-slate-950 flex items-center justify-center text-lg hover:scale-105 transition-all"><i class="fa-solid fa-play"></i></button>
                    <button onclick="nextTrack()" class="text-slate-400 hover:text-white transition-all text-lg"><i class="fa-solid fa-forward-step"></i></button>
                </div>
                <div class="flex items-center gap-3 w-full max-w-md">
                    <span id="current-time" class="text-[10px] text-slate-500 font-mono">0:00</span>
                    <div class="flex-grow bg-slate-800 h-1 rounded-full relative cursor-pointer" id="progress-container" onclick="seek(event)">
                        <div id="progress-bar" class="bg-violet-500 h-1 rounded-full w-0"></div>
                    </div>
                    <span id="total-duration" class="text-[10px] text-slate-500 font-mono">0:00</span>
                </div>
            </div>

            <div class="hidden md:flex items-center justify-end gap-3 w-1/3">
                <i class="fa-solid fa-volume-low text-slate-400"></i>
                <input type="range" min="0" max="1" step="0.01" value="0.8" oninput="changeVolume(event)" class="w-24 accent-violet-500 bg-slate-800 rounded-lg appearance-none h-1">
            </div>
        </footer>
    </div>

    <!-- Universal Dynamic Sticky Footer -->
    <footer class="w-full text-center py-4 text-xs font-semibold tracking-wider text-slate-500 border-t border-slate-900 bg-slate-950/40 backdrop-blur">
        Created by Biraj Biswas
    </footer>

    <audio id="audio-player"></audio>

    <script>
        // Global Initialization of Connected Database Relay Network
        const _supabase = supabase.createClient('YOUR_SUPABASE_URL', 'YOUR_SUPABASE_KEY');

        let currentTrackIndex = -1;
        let tracksList = [];
        const audio = document.getElementById('audio-player');

        function toggleAuthTab(tab) {
            const loginTab = document.getElementById('tab-login');
            const registerTab = document.getElementById('tab-register');
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            if (tab === 'login') {
                loginTab.className = "flex-1 py-2 text-sm font-semibold rounded-xl bg-violet-600 text-white transition-all";
                registerTab.className = "flex-1 py-2 text-sm font-semibold rounded-xl text-slate-400 transition-all";
                loginForm.classList.remove('hidden'); registerForm.classList.add('hidden');
            } else {
                registerTab.className = "flex-1 py-2 text-sm font-semibold rounded-xl bg-violet-600 text-white transition-all";
                loginTab.className = "flex-1 py-2 text-sm font-semibold rounded-xl text-slate-400 transition-all";
                registerForm.classList.remove('hidden'); loginForm.classList.add('hidden');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            let { data: users } = await _supabase.from('registered_users').select('*');
            users = users || [];
            if (users.find(u => u.username === username)) { alert("Username in use."); return; }

            await _supabase.from('registered_users').insert([{ username, email, password, registeredAt: new Date().toLocaleString(), status: 'Pending' }]);
            alert("Registered successfully!");
            toggleAuthTab('login');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            let { data: users } = await _supabase.from('registered_users').select('*');
            users = users || [];
            const user = users.find(u => u.username === username && u.password === password);

            if (user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('player-screen').classList.remove('hidden');
                document.getElementById('user-display-name').textContent = user.username;
                loadLibrary();
            } else { alert("Incorrect credentials."); }
        }

        function logout() {
            document.getElementById('player-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
        }

        async function loadLibrary() {
            const grid = document.getElementById('track-grid');
            let { data: music } = await _supabase.from('uploaded_music').select('*').order('id', { ascending: true });
            tracksList = music || [];

            if (tracksList.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-slate-500 text-sm">No tracks available.</div>`;
                return;
            }

            grid.innerHTML = tracksList.map((track, idx) => `
                <div onclick="playTrack(${idx})" class="group liquid-glass p-4 rounded-2xl cursor-pointer hover:bg-white/5 transition-all transform hover:-translate-y-1">
                    <div class="relative aspect-square mb-4 rounded-xl overflow-hidden shadow-lg">
                        <img src="${track.thumbnail}" class="w-full h-full object-cover group-hover:scale-105 transition-all" alt="">
                        <div class="absolute inset-0 bg-slate-950/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                            <span class="w-12 h-12 rounded-full bg-violet-600 flex items-center justify-center text-white"><i class="fa-solid fa-play"></i></span>
                        </div>
                    </div>
                    <h3 class="font-bold text-sm text-white truncate">${track.name}</h3>
                    <p class="text-xs text-slate-400 truncate mt-1">${track.creator}</p>
                </div>
            `).join('');
        }

        function playTrack(idx) {
            currentTrackIndex = idx;
            const track = tracksList[currentTrackIndex];
            document.getElementById('current-cover').src = track.thumbnail;
            document.getElementById('current-title').textContent = track.name;
            document.getElementById('current-artist').textContent = `By ${track.creator}`;
            audio.src = track.songSource;
            audio.play();
            document.getElementById('play-btn').innerHTML = `<i class="fa-solid fa-pause"></i>`;
        }

        function togglePlay() {
            if (currentTrackIndex === -1 && tracksList.length > 0) { playTrack(0); return; }
            if (audio.paused) { audio.play(); document.getElementById('play-btn').innerHTML = `<i class="fa-solid fa-pause"></i>`; }
            else { audio.pause(); document.getElementById('play-btn').innerHTML = `<i class="fa-solid fa-play"></i>`; }
        }

        function prevTrack() { if (currentTrackIndex > 0) playTrack(currentTrackIndex - 1); }
        function nextTrack() { if (currentTrackIndex < tracksList.length - 1) playTrack(currentTrackIndex + 1); }

        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / (audio.duration || 1)) * 100;
            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('current-time').textContent = formatTime(audio.currentTime);
            document.getElementById('total-duration').textContent = formatTime(audio.duration || 0);
        });

        function formatTime(secs) {
            const m = Math.floor(secs / 60), s = Math.floor(secs % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function seek(e) {
            const rect = document.getElementById('progress-container').getBoundingClientRect();
            if (audio.duration) audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
        }

        function changeVolume(e) { audio.volume = e.target.value; }

        // AUTOMATIC LIVE CLOUD CHANNEL STORAGE MONITOR (Syncs views across Netlify seamlessly)
        setInterval(() => {
            if (!document.getElementById('player-screen').classList.contains('hidden')) {
                loadLibrary();
            }
        }, 4000);
    </script>
</body>
</html>
